kind = "web"
previewPath = "/"
title = "Personality Insight"
version = "1.0.0"
id = "artifacts/personality-insight"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24852

[services.development]
run = "pnpm --filter @workspace/personality-insight run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/personality-insight", "run", "build" ]
publicDir = "artifacts/personality-insight/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24852"
BASE_PATH = "/"
